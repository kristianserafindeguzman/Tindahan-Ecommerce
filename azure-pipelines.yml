trigger:
  branches:
    include:
      - main
      - dev

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: GithubSyncVariables # Connects the variable group in Azure DevOps

steps:
- checkout: self
  persistCredentials: true
  clean: true
  fetchDepth: 0 # Fetches full history so git pushes cleanly

- script: |
    # Formulate the authenticated URL using your secret PAT variable
    GITHUB_REPO_URL="https://$(GITHUB_PAT)@github.com/kristianserafindeguzman/Tindahan-Ecommerce.git"
    
    echo "Configuring git author identity..."
    git config --global user.email "devops-sync@local"
    git config --global user.name "Azure DevOps Sync"
    
    echo "Pushing and mirroring branches/tags to GitHub..."
    git push --prune $GITHUB_REPO_URL +refs/remotes/origin/*:refs/heads/* +refs/tags/*:refs/tags/*
  displayName: 'Sync Azure DevOps Repo to GitHub'